# Change the two paths below to the location of your clone.
# Include this file from XAMPP apache/conf/httpd.conf, then restart Apache.
Listen 127.0.0.1:8188
<VirtualHost 127.0.0.1:8188>
    ServerName localhost
    DocumentRoot "C:/xampp/htdocs/matte-hardware-php/public"
    <Directory "C:/xampp/htdocs/matte-hardware-php/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>
    <IfModule php_module>
        php_value upload_max_filesize 12M
        php_value post_max_size 100M
        php_value memory_limit 256M
        php_value max_execution_time 120
        php_flag display_errors Off
        php_flag log_errors On
    </IfModule>
</VirtualHost>
